name: Update Dividend Snapshot

on:
  workflow_dispatch:
  schedule:
    # 每周三北京时间 23:10 唤醒；下方固定锚点检查确保隔周抓取和推送。
    - cron: '10 15 * * 3'

permissions:
  contents: write

concurrency:
  group: update-dividend-snapshot
  cancel-in-progress: false

jobs:
  update-dividend-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Check fortnightly schedule
        id: cadence
        run: node scripts/check-snapshot-schedule.mjs

      - name: Install snapshot dependencies
        if: steps.cadence.outputs.due == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test snapshot parser
        if: steps.cadence.outputs.due == 'true'
        run: npm test

      - name: Update snapshot
        id: update_snapshot
        if: steps.cadence.outputs.due == 'true'
        continue-on-error: true
        run: node scripts/update-dividend-snapshot.mjs

      - name: Update market fallback snapshot
        id: update_market
        if: always() && steps.cadence.outputs.due == 'true' && steps.update_snapshot.outcome != 'skipped'
        continue-on-error: true
        run: node scripts/update-market-snapshot.mjs

      - name: Commit snapshot state
        if: always() && (steps.update_snapshot.outcome == 'success' || steps.update_snapshot.outcome == 'failure' || steps.update_market.outcome == 'success' || steps.update_market.outcome == 'failure')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dividendSnapshot.js data/marketSnapshot.js
          git diff --cached --quiet || git commit -m "chore: update dividend snapshot state"

      - name: Push snapshot state
        if: always() && (steps.update_snapshot.outcome == 'success' || steps.update_snapshot.outcome == 'failure' || steps.update_market.outcome == 'success' || steps.update_market.outcome == 'failure')
        run: git push

      - name: Mark fetch failure after persisting diagnostics
        if: steps.update_snapshot.outcome == 'failure' || steps.update_market.outcome == 'failure'
        run: exit 1
